name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

      - name: Test report generation
        run: |
          python scripts/generate_report.py
          
      - name: Verify report was created
        run: |
          if [ ! -f reports/daily_status.md ]; then
            echo "Error: Report file was not created"
            exit 1
          fi
          echo "✅ Report generated successfully"

      - name: Display report
        if: always()
        run: |
          echo "## Generated Report" >> $GITHUB_STEP_SUMMARY
          cat reports/daily_status.md >> $GITHUB_STEP_SUMMARY
