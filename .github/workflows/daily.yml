name: Daily Report Generation

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger

# Prevent concurrent runs
concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        continue-on-error: false

      - name: Install GitHub CLI
        run: |
          # GitHub CLI is pre-installed on ubuntu-latest runners
          gh --version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        continue-on-error: false

      - name: Generate report
        id: generate
        run: |
          python scripts/generate_report.py
          echo "Report generation completed"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet reports/daily_status.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in report" >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in report" >> $GITHUB_STEP_SUMMARY
            git diff reports/daily_status.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git for verified commits
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Configure Git user for the PR bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # GitHub Actions bot commits are automatically signed/verified
          # when using the GITHUB_TOKEN and the bot user email
          echo "✅ Git configured for verified commits" >> $GITHUB_STEP_SUMMARY
          echo "Commits will be signed as: github-actions[bot]" >> $GITHUB_STEP_SUMMARY

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update daily status report
            
            Automated daily report generation
            
            Generated on: ${{ github.run_id }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: daily-report-${{ github.run_number }}
          delete-branch: true
          title: 'chore: daily status report update'
          body: |
            ## Automated Daily Status Report
            
            This PR contains the updated daily status report.
            
            ### Changes
            - Updated repository metrics
            - Updated GitHub activity statistics
            - Updated code metrics
            
            ### Report Details
            - **Generated:** ${{ github.run_id }}
            - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ---
            
            🤖 This PR was automatically created by the daily report workflow.
            
            **Note:** Commits are signed and verified using the GitHub Actions bot identity.
          labels: |
            automated
            report
            documentation
          draft: false

      - name: Report Summary
        if: always()
        run: |
          echo "## Daily Report Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Detected:** ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Retry on transient failure
        if: failure() && github.run_attempt < 3
        run: |
          echo "⚠️ Workflow failed. This is attempt ${{ github.run_attempt }} of 3" >> $GITHUB_STEP_SUMMARY
          echo "The workflow will automatically retry if re-triggered" >> $GITHUB_STEP_SUMMARY
          exit 1
